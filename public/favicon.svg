<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景圓角方形漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>

    <!-- 熱氣球主體漸層 -->
    <linearGradient id="balloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.25" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App 圖標底座（圓角 Squircle） -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- 雲朵裝飾（營造戶外郊遊天空感） -->
  <path d="M 16,92 Q 22,82 32,84 Q 40,76 52,82 Q 62,84 66,92 Z" fill="#FFFFFF" opacity="0.35" />
  <path d="M 72,100 Q 80,90 92,92 Q 102,86 112,94 Z" fill="#FFFFFF" opacity="0.28" />

  <!-- 熱氣球 / 地標探險主體 (代表台灣親子出遊與地圖情報) -->
  <g filter="url(#dropShadow)" transform="translate(64, 52)">
    <!-- 氣球圓弧外觀 (水滴/氣球幾何) -->
    <path d="M 0,-38 C 26,-38 36,-14 26,10 C 20,24 10,32 6,34 L -6,34 C -10,32 -20,24 -26,10 C -36,-14 -26,-38 0,-38 Z" fill="#FFFFFF" />

    <!-- 彩色條紋 (象徵多元活動：展覽藍、劇團粉、森林綠、節慶黃) -->
    <!-- 中間左條紋：天空藍 -->
    <path d="M -8,-37 C -3,-37 0,-14 -1,34 L -7,34 C -12,30 -19,20 -24,8 C -18,-12 -14,-32 -8,-37 Z" fill="#0EA5E9" />
    <!-- 中間右條紋：珊瑚粉 -->
    <path d="M 8,-37 C 3,-37 0,-14 1,34 L 7,34 C 12,30 19,20 24,8 C 18,-12 14,-32 8,-37 Z" fill="#F43F5E" />
    <!-- 中間核心黃金色 -->
    <path d="M -3,-37.8 C 0,-38 0,-38 3,-37.8 C 3,-10 2,15 1,34 L -1,34 C -2,15 -3,-10 -3,-37.8 Z" fill="#FBBF24" />

    <!-- 氣球高光反射 -->
    <ellipse cx="-12" cy="-22" rx="5" ry="9" transform="rotate(-25 -12 -22)" fill="#FFFFFF" opacity="0.65" />

    <!-- 連接繩索 -->
    <line x1="-8" y1="34" x2="-6" y2="42" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="34" x2="6" y2="42" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-2" y1="34" x2="-2" y2="42" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="2" y1="34" x2="2" y2="42" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" />

    <!-- 探索吊籃 / 地圖釘標記 -->
    <rect x="-9" y="42" width="18" height="12" rx="3.5" fill="#B45309" stroke="#78350F" stroke-width="1.2" />
    <!-- 吊籃裝飾線 -->
    <line x1="-9" y1="46" x2="9" y2="46" stroke="#D97706" stroke-width="1.5" />
    <!-- 小旗幟 / 歡樂綵帶 -->
    <polygon points="-6,46 -3,51 0,46" fill="#F59E0B" />
    <polygon points="0,46 3,51 6,46" fill="#10B981" />
  </g>

  <!-- 閃亮小星星 (代表驚喜活動、搶票亮點) -->
  <g fill="#FEF08A">
    <!-- 左上星芒 -->
    <path d="M 22,28 Q 28,28 28,22 Q 28,28 34,28 Q 28,28 28,34 Q 28,28 22,28 Z" filter="url(#dropShadow)" />
    <!-- 右上大星芒 -->
    <path d="M 96,24 Q 103,24 103,17 Q 103,24 110,24 Q 103,24 103,31 Q 103,24 96,24 Z" filter="url(#dropShadow)" />
    <!-- 右中小星芒 -->
    <path d="M 102,68 Q 106,68 106,64 Q 106,68 110,68 Q 106,68 106,72 Q 106,68 102,68 Z" />
  </g>

  <!-- 微笑小弧線 (象徵小朋友的笑容) -->
  <path d="M 58,114 Q 64,118 70,114" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
</svg>