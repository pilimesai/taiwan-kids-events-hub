name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    # 每日凌晨 03:00 (UTC 19:00) 自動同步文化部最新藝文開放資料並更新部署
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Culture Events
        run: node scripts/syncCultureEvents.js

      - name: Commit and push if data updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/cultureEvents.json src/data/cultureEvents.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): 每日自動同步文化部最新藝文活動 [skip ci]" && git push)

      - name: Build
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
